[package]
name = "agal-core"
version = "0.5.4"
edition = "2024"
description = "Core library for agentic-audiolab (agal)"
license = "GPL-3.0-or-later"
authors = ["agentic-audiolab contributors"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
syn = { version = "2", features = ["full", "visit"] }
walkdir = "2"
notify = "8"
